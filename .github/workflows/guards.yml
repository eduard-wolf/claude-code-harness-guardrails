# Runs the repository's own guards on every push and pull request.
#
# Deliberately no `paths:` filter: path filters are evaluated per push, not
# per commit (see trap catalog), and these guards are cheap enough to run
# always. Each guard runs its built-in counter-test first (--self-test):
# a guard that cannot fail on purpose proves nothing.
#
# The third guard is why the runner matters rather than merely being free
# compute: it re-runs the trap catalog's own traps here, on a host that is
# not the maintainer's machine, and prints the environment it judged on. What
# this host cannot reproduce — the Claude Code harness is on no runner, and
# whatever shells or interpreters this image happens not to carry — comes out
# of it named, with a number and a reason, rather than silently dropped. The
# guard reads which is which off this runner instead of off a software list.
name: guards
on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: README parity (EN/DE same sections, same order)
        run: node guards/check-readme-parity.mjs --self-test
      - name: Stated counts match measured counts
        run: node guards/check-counts.mjs --self-test
      - name: Trap catalog still reproduces (and names what it cannot)
        run: node guards/verify-traps.mjs --self-test
